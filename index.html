<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Galaxy.FM</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Galaxy.FM">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav id="nav">
      <div class="brand"><img src="./icon-192.png" alt=""><span>Galaxy.FM</span></div>
      <button class="nav-btn" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></button>
      <button class="nav-btn" data-view="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Search</span></button>
      <button class="nav-btn" data-view="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5 17.1-1.9.6z"/></svg><span>Library</span></button>
      <button class="nav-btn" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm8.6 5.3-1.9-.3a7 7 0 0 1-.6 1.5l1.1 1.6-1.4 1.4-1.6-1.1a7 7 0 0 1-1.5.6l-.3 1.9h-2l-.3-1.9a7 7 0 0 1-1.5-.6l-1.6 1.1-1.4-1.4 1.1-1.6a7 7 0 0 1-.6-1.5l-1.9-.3v-2l1.9-.3a7 7 0 0 1 .6-1.5L6.6 7.4 8 6l1.6 1.1a7 7 0 0 1 1.5-.6l.3-1.9h2l.3 1.9a7 7 0 0 1 1.5.6L16.8 6l1.4 1.4-1.1 1.6a7 7 0 0 1 .6 1.5l1.9.3z"/></svg><span>Settings</span></button>
    </nav>

    <main id="view"></main>

    <div id="mini" class="hidden">
      <div class="mini-progress"><div id="mini-bar"></div></div>
      <div class="mini-row">
        <button id="mini-open" class="mini-info">
          <img id="mini-art" alt="">
          <div class="mini-text"><div id="mini-title"></div><div id="mini-artist"></div></div>
        </button>
        <button class="icon-btn" id="mini-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="icon-btn play" id="mini-play" aria-label="Play"></button>
        <button class="icon-btn" id="mini-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
    </div>

    <section id="np" class="hidden" aria-label="Now playing">
      <div id="np-bg"></div>
      <header class="np-head">
        <button class="icon-btn" id="np-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg></button>
        <div class="np-tabs"><button data-np="art" class="on">Playing</button><button data-np="lyrics">Lyrics</button><button data-np="queue">Up next</button></div>
        <button class="icon-btn" id="np-like" aria-label="Like"></button>
      </header>
      <div class="np-body">
        <div id="np-art-wrap" class="np-pane on"><img id="np-art" alt=""></div>
        <div id="np-lyrics" class="np-pane"></div>
        <div id="np-queue" class="np-pane"></div>
      </div>
      <div class="np-meta"><div id="np-title"></div><div id="np-artist"></div></div>
      <div class="np-seek">
        <input type="range" id="np-range" min="0" max="1000" value="0">
        <div class="np-times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
      </div>
      <div class="np-controls">
        <button class="icon-btn" id="np-shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.4-1.4-3.8 3.8-1.4-1.4 3.8-3.8zM3 5.6 4.4 4.2l15.4 15.4V18h1.2v3h-4v-1.2h1.6L3 5.6zm11.6 9.8 1.4-1.4 3.6 3.6-1.4 1.4z"/></svg></button>
        <button class="icon-btn big" id="np-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="icon-btn play huge" id="np-play" aria-label="Play"></button>
        <button class="icon-btn big" id="np-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="icon-btn" id="np-repeat" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      </div>
    </section>

    <div id="sheet" class="hidden"><div class="sheet-card" id="sheet-card"></div></div>
    <div id="toast"></div>
    <div id="yt-host"><div id="yt-player"></div></div>
    <audio id="audio" preload="auto"></audio>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
